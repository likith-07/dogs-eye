<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DOGSEYE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #020403;
            --terminal: #050807;
            --border: #163d25;
            --green: #00ff66;
            --green-dim: #00a844;
            --green-dark: #003b19;
            --text: #a8ffbd;
            --muted: #4f8f61;
            --red: #ff4d4d;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #06150a 0%,
                    #020403 70%
                );

            color: var(--text);

            font-family:
                "Courier New",
                monospace;

            overflow: hidden;
        }

        .terminal {
            width: min(1400px, 96vw);
            height: min(900px, 94vh);

            margin: 3vh auto;

            background: var(--terminal);

            border: 1px solid var(--border);

            box-shadow:
                0 0 20px rgba(0, 255, 102, 0.08),
                inset 0 0 30px rgba(0, 255, 102, 0.02);

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .terminal-header {
            height: 48px;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            flex-shrink: 0;
        }

        .title {
            color: var(--green);

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 3px;

            text-shadow:
                0 0 8px rgba(0, 255, 102, 0.7);
        }

        .status {
            font-size: 12px;

            color: var(--green-dim);

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 8px var(--green);
        }

        .status-dot.processing {
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.3;
            }
        }

        /* =========================
           UPLOAD
        ========================= */

        .control-bar {
            padding: 14px 18px;

            border-bottom: 1px solid var(--border);

            display: flex;
            gap: 10px;
            align-items: center;

            flex-shrink: 0;
        }

        .file-input-wrapper {
            flex: 1;

            position: relative;
        }

        input[type="file"] {
            width: 100%;

            color: var(--muted);

            font-family: inherit;

            font-size: 12px;
        }

        input[type="file"]::file-selector-button {
            background: transparent;

            border: 1px solid var(--green-dark);

            color: var(--green);

            padding: 7px 12px;

            margin-right: 12px;

            font-family: inherit;

            cursor: pointer;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--green-dark);
        }

        button {
            background: transparent;

            border: 1px solid var(--green);

            color: var(--green);

            padding: 8px 18px;

            font-family: inherit;

            font-size: 12px;

            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {
            background: var(--green);

            color: #000;

            box-shadow:
                0 0 10px rgba(0, 255, 102, 0.4);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* =========================
           RESULTS
        ========================= */

        .results-grid {
            flex: 1;

            min-height: 0;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            padding: 12px;
        }

        .panel {
            border: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            min-width: 0;
            min-height: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 255, 102, 0.025),
                    transparent
                );
        }

        .panel-header {
            padding: 10px;

            border-bottom: 1px solid var(--border);

            color: var(--green);

            font-size: 12px;

            display: flex;
            justify-content: space-between;

            flex-shrink: 0;
        }

        .count {
            color: var(--muted);
        }

        .results {
            list-style: none;

            margin: 0;
            padding: 8px;

            overflow-y: auto;

            flex: 1;
        }

        .result {
            padding: 9px;

            margin-bottom: 7px;

            border-left: 2px solid var(--green-dark);

            background:
                rgba(0, 255, 102, 0.02);

            font-size: 11px;
        }

        .result:hover {
            border-left-color: var(--green);

            background:
                rgba(0, 255, 102, 0.05);
        }

        .result a {
            color: var(--text);

            text-decoration: none;

            word-break: break-word;
        }

        .result a:hover {
            color: var(--green);
        }

        .meta {
            margin-top: 7px;

            display: flex;
            justify-content: space-between;

            gap: 8px;

            color: var(--muted);

            font-size: 10px;
        }

        .verified {
            color: var(--green);
        }

        .unverified {
            color: #a0a0a0;
        }

        .empty {
            color: var(--muted);

            font-size: 11px;

            padding: 10px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            body {
                overflow: auto;
            }

            .terminal {
                height: auto;
                min-height: 94vh;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .panel {
                height: 300px;
            }
        }

    </style>
</head>


<body>

<div class="terminal">

    <!-- HEADER -->

    <div class="terminal-header">

        <div class="title">
            DOGSEYE
        </div>

        <div class="status">

            <span
                class="status-dot"
                id="statusDot"
            ></span>

            <span id="statusText">
                SYSTEM ONLINE
            </span>

        </div>

    </div>


    <!-- CONTROL -->

    <div class="control-bar">

        <div class="file-input-wrapper">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </div>

        <button
            id="runButton"
            onclick="runPipeline()"
        >
            EXECUTE
        </button>

    </div>


    <!-- RESULTS -->

    <div class="results-grid">


        <!-- PROFILES -->

        <div class="panel">

            <div class="panel-header">

                <span>
                    PROFILES
                </span>

                <span
                    class="count"
                    id="profilesCount"
                >
                    0
                </span>

            </div>

            <ul
                class="results"
                id="profilesList"
            >
                <div class="empty">
                    Waiting for input...
                </div>
            </ul>

        </div>


        <!-- POSTS -->

        <div class="panel">

            <div class="panel-header">

                <span>
                    POSTS
                </span>

                <span
                    class="count"
                    id="postsCount"
                >
                    0
                </span>

            </div>

            <ul
                class="results"
                id="postsList"
            >
                <div class="empty">
                    Waiting for input...
                </div>
            </ul>

        </div>


        <!-- EXTERNAL -->

        <div class="panel">

            <div class="panel-header">

                <span>
                    EXTERNAL LINKS
                </span>

                <span
                    class="count"
                    id="externalCount"
                >
                    0
                </span>

            </div>

            <ul
                class="results"
                id="externalList"
            >
                <div class="empty">
                    Waiting for input...
                </div>
            </ul>

        </div>


    </div>

</div>


<script>

    const API_URL =
        "http://127.0.0.1:8000/api/investigate";


    function setStatus(
        text,
        processing = false
    ) {

        document
            .getElementById("statusText")
            .textContent = text;


        const dot =
            document.getElementById(
                "statusDot"
            );


        if (processing) {

            dot.classList.add(
                "processing"
            );

        } else {

            dot.classList.remove(
                "processing"
            );

        }

    }


    async function runPipeline() {

        const fileInput =
            document.getElementById(
                "imageInput"
            );

        const button =
            document.getElementById(
                "runButton"
            );


        if (
            fileInput.files.length === 0
        ) {

            setStatus(
                "NO FILE SELECTED"
            );

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "file",
            fileInput.files[0]
        );


        button.disabled = true;


        setStatus(
            "PROCESSING...",
            true
        );


        clearResults();


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Backend request failed"
                );

            }


            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Pipeline failed"
                );

            }


            renderResults(
                data.results || []
            );


            setStatus(
                "ANALYSIS COMPLETE"
            );


        } catch (error) {

            console.error(error);


            setStatus(
                "ERROR"
            );


            document
                .getElementById(
                    "externalList"
                )
                .innerHTML = `
                    <div class="empty">
                        ${error.message}
                    </div>
                `;

        } finally {

            button.disabled = false;

        }

    }


    function clearResults() {

        document
            .getElementById(
                "profilesList"
            )
            .innerHTML = "";


        document
            .getElementById(
                "postsList"
            )
            .innerHTML = "";


        document
            .getElementById(
                "externalList"
            )
            .innerHTML = "";


        document
            .getElementById(
                "profilesCount"
            )
            .textContent = "0";


        document
            .getElementById(
                "postsCount"
            )
            .textContent = "0";


        document
            .getElementById(
                "externalCount"
            )
            .textContent = "0";

    }


    function isPost(url) {

        if (!url) {
            return false;
        }


        const lower =
            url.toLowerCase();


        return (

            lower.includes(
                "/p/"
            )

            ||

            lower.includes(
                "/reel/"
            )

            ||

            lower.includes(
                "/status/"
            )

            ||

            lower.includes(
                "/video/"
            )

            ||

            lower.includes(
                "/post/"
            )

            ||

            lower.includes(
                "/shorts/"
            )

            ||

            lower.includes(
                "/watch?"
            )

        );

    }


    function isSocialMedia(url) {

        if (!url) {
            return false;
        }


        const domains = [

            "instagram.com",

            "facebook.com",

            "x.com",

            "twitter.com",

            "tiktok.com",

            "threads.com",

            "youtube.com",

            "linkedin.com",

            "clubhouse.com"

        ];


        try {

            const hostname =
                new URL(url)
                    .hostname
                    .toLowerCase();


            return domains.some(
                domain =>
                    hostname === domain
                    ||
                    hostname.endsWith(
                        "." + domain
                    )
            );

        } catch {

            return false;

        }

    }


    function createResult(
        item
    ) {

        const li =
            document.createElement(
                "li"
            );


        li.className =
            "result";


        const url =
            item.page_url
            ||
            item.image_url
            ||
            "#";


        const source =
            item.source
            ||
            item.provider
            ||
            "unknown";


        const verified =
            item.verified === true;


        const score =
            typeof item.similarity_score
                === "number"
                ? (
                    item.similarity_score
                    * 100
                ).toFixed(1)
                + "%"
                : "N/A";


        li.innerHTML = `

            <a
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${url}
            </a>

            <div class="meta">

                <span>
                    ${source}
                </span>

                <span
                    class="${
                        verified
                            ? "verified"
                            : "unverified"
                    }"
                >
                    ${
                        verified
                            ? "MATCH"
                            : "FOUND"
                    }

                    · ${score}

                </span>

            </div>

        `;


        return li;

    }


    function renderResults(
        results
    ) {

        const profiles =
            document.getElementById(
                "profilesList"
            );


        const posts =
            document.getElementById(
                "postsList"
            );


        const external =
            document.getElementById(
                "externalList"
            );


        let profileCount = 0;

        let postCount = 0;

        let externalCount = 0;


        results.forEach(
            item => {

                const url =
                    item.page_url
                    ||
                    item.image_url
                    ||
                    "";


                const element =
                    createResult(
                        item
                    );


                /*
                 * Priority:
                 *
                 * 1. Social media post
                 * 2. Social media profile
                 * 3. External link
                 */

                if (
                    isSocialMedia(url)
                    &&
                    isPost(url)
                ) {

                    posts.appendChild(
                        element
                    );

                    postCount++;

                }

                else if (
                    isSocialMedia(url)
                ) {

                    profiles.appendChild(
                        element
                    );

                    profileCount++;

                }

                else {

                    external.appendChild(
                        element
                    );

                    externalCount++;

                }

            }
        );


        if (profileCount === 0) {

            profiles.innerHTML =
                `<div class="empty">
                    No profiles found.
                </div>`;

        }


        if (postCount === 0) {

            posts.innerHTML =
                `<div class="empty">
                    No posts found.
                </div>`;

        }


        if (externalCount === 0) {

            external.innerHTML =
                `<div class="empty">
                    No external links found.
                </div>`;

        }


        document
            .getElementById(
                "profilesCount"
            )
            .textContent =
                profileCount;


        document
            .getElementById(
                "postsCount"
            )
            .textContent =
                postCount;


        document
            .getElementById(
                "externalCount"
            )
            .textContent =
                externalCount;

    }

</script>

</body>
</html>s
