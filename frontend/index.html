<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGSEYE // NET_SEARCH</title>
    
    <!-- Y2K Pixel Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* =====================================================
           THEME VARIABLES (Custom Palette)
           #462C7D, #831C91, #D552A3, #FF70BF
        ===================================================== */
        :root {
            --bg-deep: #1a0f2e;
            --bg-panel: #261747;
            --text-main: #fce8f3;
            --text-muted: #b891b8;
            
            --color-dark-purple: #462C7D;
            --color-deep-magenta: #831C91;
            --color-mid-pink: #D552A3;
            --color-bright-pink: #FF70BF;
            
            --border-color: #5c3578;
            --bg-highlight: #34205c;
            
            --font-heading: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at center, #361b5c 0%, var(--bg-deep) 100%),
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAABZJREFUeNpi2r9//38bIxsTAxIgAQYAW7sD3X3b9JAAAAAASUVORK5CYII='); 
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 19px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =====================================================
           CRT EFFECTS
        ===================================================== */
        .crt-scanlines {
            position: fixed; inset: 0; z-index: 9998; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(255,112,191,0.015) 0px, rgba(255,112,191,0.015) 1px, transparent 1px, transparent 3px);
        }

        .crt-flicker {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            background: rgba(0, 0, 0, 0.04);
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.02; } 100% { opacity: 0.06; }
        }

        /* =====================================================
           BOOT SEQUENCE ANIMATION
        ===================================================== */
        #boot-screen {
            position: fixed; inset: 0; background: var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            z-index: 10000; transition: opacity 1.2s ease-out;
        }

        .boot-content { text-align: center; }

        .loading-bar-container {
            width: 300px; height: 10px; border: 1px solid var(--color-bright-pink);
            margin: 20px auto; padding: 2px;
        }

        .loading-bar {
            height: 100%; background: var(--color-mid-pink); width: 0%;
            animation: loadBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes loadBar {
            0% { width: 0%; } 40% { width: 45%; } 80% { width: 80%; } 100% { width: 100%; }
        }

        /* =====================================================
           LAYOUT & WINDOWS
        ===================================================== */
        #app-container {
            max-width: 1400px; margin: 0 auto; padding: 15px;
            opacity: 0; transform: translateY(10px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #app-container.loaded { opacity: 1; transform: translateY(0); }

        .app-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 20px; border-bottom: 2px solid var(--color-deep-magenta); padding-bottom: 10px;
        }

        .logo-text { font-family: var(--font-heading); font-size: 26px; letter-spacing: 1px; color: var(--text-main); text-shadow: 2px 2px var(--color-dark-purple); }
        .logo-subtle { color: var(--color-bright-pink); }

        .ticker-wrap {
            width: 350px; overflow: hidden; background: #000;
            border: 1px solid var(--color-dark-purple); padding: 5px; font-size: 15px;
        }
        .ticker-move {
            display: inline-block; white-space: nowrap;
            animation: ticker 12s linear infinite; color: var(--color-bright-pink);
        }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .window {
            background: var(--bg-panel); border: 2px solid var(--color-dark-purple);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
            margin-bottom: 15px;
        }

        .window-titlebar {
            background: var(--color-dark-purple); color: var(--text-main); padding: 7px 10px;
            font-family: var(--font-heading); font-size: 9px; letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .bg-purple { background: var(--color-dark-purple); color: #fff; }
        .bg-magenta { background: var(--color-deep-magenta); color: #fff; }
        .bg-pink { background: var(--color-mid-pink); color: #fff; }

        .window-controls span { margin-left: 5px; cursor: pointer; color: inherit; opacity: 0.7; }
        .window-controls span:hover { opacity: 1; }
        .window-content { padding: 15px; }

        /* =====================================================
           INPUTS & BUTTONS
        ===================================================== */
        .upload-content { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }

        .file-input-wrapper { display: flex; align-items: center; gap: 15px; min-width: 0; flex: 1; }
        input[type="file"] { display: none; }

        .custom-file-upload {
            font-family: var(--font-heading); font-size: 10px; color: var(--text-main);
            border: 1px solid var(--color-mid-pink); padding: 8px 14px; cursor: pointer;
            transition: all 0.2s; background: var(--color-dark-purple); white-space: nowrap;
        }
        .custom-file-upload:hover { background: var(--color-deep-magenta); }
        .file-name { color: var(--text-muted); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .y2k-button {
            font-family: var(--font-heading); font-size: 11px;
            background: var(--color-bright-pink); color: #1a0f2e; border: 2px solid #fff;
            padding: 10px 20px; cursor: pointer; box-shadow: 3px 3px 0px var(--color-dark-purple);
            transition: transform 0.1s, box-shadow 0.1s; white-space: nowrap;
        }
        .y2k-button:hover:not(:disabled) { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--color-dark-purple); background: #ff8cd1; }
        .y2k-button:disabled { opacity: 0.5; filter: grayscale(100%); cursor: not-allowed; }

        .y2k-button-small {
            font-family: var(--font-heading); font-size: 9px; padding: 6px 10px;
            background: var(--color-deep-magenta); color: #fff; border: 1px solid #fff; cursor: pointer;
        }
        .y2k-button-small:hover:not(:disabled) { background: var(--color-bright-pink); color: #000; }

        /* =====================================================
           RESULTS GRID (3 Columns forced into a single row, no scrolling)
        ===================================================== */
        .results-grid { 
            display: grid; 
            grid-template-columns: repeat(3, minmax(0, 1fr)); 
            gap: 15px; 
            margin-bottom: 15px; 
            width: 100%;
        }

        .results-grid .window {
            min-width: 0;
            margin-bottom: 0;
        }

        .results-list { 
            list-style: none; 
            padding: 8px; 
            height: 280px; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* Scrollbar */
        .results-list::-webkit-scrollbar { width: 6px; }
        .results-list::-webkit-scrollbar-track { background: #000; }
        .results-list::-webkit-scrollbar-thumb { background: var(--color-deep-magenta); }

        /* Interactive Result Box */
        .result-item {
            background: #140b24;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            animation: popIn 0.4s ease-out forwards; 
            opacity: 0; transform: translateY(5px);
            overflow: hidden;
            word-break: break-all;
        }

        .result-item:hover { background: var(--bg-highlight); border-color: var(--color-bright-pink); }
        .result-item.expanded { border-left: 3px solid var(--color-bright-pink); background: var(--bg-highlight); }

        @keyframes popIn { to { opacity: 1; transform: translateY(0); } }

        /* Summary (Always Visible) */
        .result-summary {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 17px; color: var(--text-main); pointer-events: none;
            gap: 10px;
        }
        
        .url-short {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            flex: 1; min-width: 0;
        }

        .score-badge { color: var(--color-bright-pink); font-size: 15px; white-space: nowrap; }

        /* Details (Hidden by Default) */
        .result-details {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.3;
            word-break: break-all;
        }

        .result-details div { margin-bottom: 5px; }
        .result-details strong { color: var(--color-bright-pink); font-weight: normal; }
        .result-details a { color: var(--color-mid-pink); text-decoration: none; border-bottom: 1px solid transparent; transition: 0.2s; }
        .result-details a:hover { color: var(--text-main); border-bottom: 1px solid var(--text-main); }

        /* =====================================================
           BLOCKCHAIN TERMINAL
        ===================================================== */
        .chain-content { display: flex; flex-direction: column; gap: 10px; }
        .chain-actions { display: flex; gap: 10px; }
        .chain-output-container {
            background: #000; border: 1px solid var(--color-dark-purple); padding: 12px; min-height: 90px;
        }
        #blockchainOutput { font-family: var(--font-body); font-size: 17px; color: var(--color-bright-pink); white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

    <!-- CRT Overlays -->
    <div class="crt-scanlines"></div>
    <div class="crt-flicker"></div>

    <!-- Boot Sequence Screen -->
    <div id="boot-screen">
        <div class="boot-content">
            <h1 class="logo-text">DOGSEYE<span class="logo-subtle">.OS</span></h1>
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <p style="color: var(--text-muted); font-size: 17px; letter-spacing: 2px;">booting system files...</p>
        </div>
    </div>

    <!-- Main Application -->
    <main id="app-container" class="hidden">
        
        <header class="app-header">
            <h1 class="logo-text">DOGSEYE<span class="logo-subtle">.EXE</span></h1>
            <div class="ticker-wrap">
                <div class="ticker-move">
                    <span id="systemNotification">WELCOME TO DOGSEYE // WAITING FOR IMAGE UPLOAD // V 2.1</span>
                </div>
            </div>
        </header>

        <!-- Input Section -->
        <section class="window upload-window">
            <div class="window-titlebar">
                <span>FILE_UPLOAD.APP</span>
                <div class="window-controls"><span>_</span><span>□</span><span>x</span></div>
            </div>
            <div class="window-content upload-content">
                <div class="file-input-wrapper">
                    <label for="imageInput" class="custom-file-upload">
                        [ SELECT IMAGE ]
                    </label>
                    <input type="file" id="imageInput" accept="image/*">
                    <span id="fileName" class="file-name">no_file.jpg</span>
                </div>
                <button id="runButton" class="y2k-button">EXECUTE</button>
            </div>
        </section>

        <!-- Results Grid (Forced into a single row, no scrolling) -->
        <section class="results-grid">
            
            <!-- Profiles Window -->
            <div class="window">
                <div class="window-titlebar bg-purple">
                    <span>PROFILES</span>
                    <span class="counter" id="profilesCount">[000]</span>
                </div>
                <ul class="results-list" id="profilesList"></ul>
            </div>

            <!-- Posts Window -->
            <div class="window">
                <div class="window-titlebar bg-magenta">
                    <span>POSTS</span>
                    <span class="counter" id="postsCount">[000]</span>
                </div>
                <ul class="results-list" id="postsList"></ul>
            </div>

            <!-- External Links Window -->
            <div class="window">
                <div class="window-titlebar bg-pink">
                    <span>EXTERNAL</span>
                    <span class="counter" id="linksCount">[000]</span>
                </div>
                <ul class="results-list" id="linksList"></ul>
            </div>

        </section>

        <!-- Blockchain Section -->
        <section class="window chain-window">
            <div class="window-titlebar">
                <span>EVIDENCE_CHAIN // SEPOLIA</span>
            </div>
            <div class="window-content chain-content">
                <div class="chain-actions">
                    <button id="registerButton" class="y2k-button-small" disabled>REGISTER</button>
                    <button id="verifyButton" class="y2k-button-small" disabled>VERIFY</button>
                </div>
                <div class="chain-output-container">
                    <pre id="blockchainOutput">Awaiting investigation...</pre>
                </div>
            </div>
        </section>

    </main>

    <script>
        const API_INVESTIGATE = "/api/investigate";

        document.addEventListener('DOMContentLoaded', () => {
            
            // --- BOOT SEQUENCE ---
            setTimeout(() => {
                const bootScreen = document.getElementById('boot-screen');
                const appContainer = document.getElementById('app-container');
                
                bootScreen.style.opacity = '0';
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    appContainer.classList.remove('hidden');
                    appContainer.classList.add('loaded');
                }, 1200); 
            }, 2000); 

            // --- STATE ---
            let currentEvidence = null;

            // --- UI HELPERS ---
            function setNotification(msg) {
                document.getElementById("systemNotification").textContent = msg;
            }

            function updateCounter(id, number) {
                document.getElementById(id).textContent = "[" + String(number).padStart(3, "0") + "]";
            }

            // --- FILE INPUT HANDLING ---
            document.getElementById("imageInput").addEventListener("change", event => {
                const file = event.target.files[0];
                document.getElementById("fileName").textContent = file ? file.name : "no_file.jpg";
                if (file) setNotification(`FILE LOADED: ${file.name}`);
            });

            // --- MAIN IMAGE PIPELINE ---
            document.getElementById("runButton").addEventListener("click", async function() {
                const fileInput = document.getElementById("imageInput");
                const runButton = document.getElementById("runButton");

                if (fileInput.files.length === 0) {
                    setNotification("ERROR: NO IMAGE SELECTED.");
                    return;
                }

                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                runButton.disabled = true;
                setNotification("PROCESSING IMAGE // EXTRACTING FEATURES...");
                
                // Clear old results
                document.getElementById("profilesList").innerHTML = "";
                document.getElementById("postsList").innerHTML = "";
                document.getElementById("linksList").innerHTML = "";
                
                try {
                    const response = await fetch(API_INVESTIGATE, { method: "POST", body: formData });
                    const data = await response.json();

                    if (!response.ok || !data.success) throw new Error(data.error || data.detail || "Pipeline failed");

                    // FIXED: Pull from data.investigation.results as returned by app.py
                    const investigation = data.investigation || {};
                    const resultsArray = investigation.results || data.results || [];
                    
                    renderResults(resultsArray);
                    
                    currentEvidence = data.evidence || null;
                    if (currentEvidence) {
                        document.getElementById("registerButton").disabled = false;
                        document.getElementById("verifyButton").disabled = false;
                        document.getElementById("blockchainOutput").textContent = "EVIDENCE PACKAGE GENERATED.\nAWAITING CHAIN REGISTRATION.";
                    }

                    setNotification(`COMPLETE // FOUND RESULTS`);
                } catch (error) {
                    console.error(error);
                    setNotification(`PIPELINE ERROR: ${error.message}`);
                } finally {
                    runButton.disabled = false;
                }
            });

            // --- RESULT RENDERING (ACCORDION BOXES) ---
            function renderResults(results) {
                const lists = {
                    profiles: document.getElementById("profilesList"),
                    posts: document.getElementById("postsList"),
                    links: document.getElementById("linksList")
                };

                let counts = { profiles: 0, posts: 0, links: 0 };

                const flatResults = Array.isArray(results) ? results : [];

                flatResults.forEach((item, index) => {
                    const url = item.page_url || item.url || item.link || item.image_url || "#";
                    if (url === "#") return;

                    const li = document.createElement("li");
                    li.className = "result-item";
                    li.style.animationDelay = `${index * 0.05}s`;
                    
                    const source = item.source || item.provider || "UNKNOWN";
                    const scoreRaw = item.similarity_score;
                    const scoreFormatted = (typeof scoreRaw === "number") ? (scoreRaw * 100).toFixed(1) + "%" : "N/A";
                    
                    li.innerHTML = `
                        <div class="result-summary">
                            <span class="url-short">${escapeHtml(url)}</span>
                            <span class="score-badge">[${scoreFormatted}]</span>
                        </div>
                        <div class="result-details">
                            <div><strong>SOURCE:</strong> ${escapeHtml(source)}</div>
                            <div><strong>TARGET LINK:</strong> <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a></div>
                            ${item.image_url ? `<div><strong>ORIGINAL IMG:</strong> <a href="${escapeHtml(item.image_url)}" target="_blank" rel="noopener noreferrer">View Source Image</a></div>` : ''}
                            <div><strong>MATCH CONFIDENCE:</strong> ${scoreFormatted}</div>
                        </div>
                    `;

                    li.addEventListener("click", function(e) {
                        if (e.target.tagName.toLowerCase() === 'a') return; 

                        const details = this.querySelector(".result-details");
                        if (details.style.display === "block") {
                            details.style.display = "none";
                            this.classList.remove("expanded");
                        } else {
                            details.style.display = "block";
                            this.classList.add("expanded");
                        }
                    });

                    const cat = item.category || (isSocialPost(url) ? "social_post" : isSocialProfile(url) ? "social_profile" : "non_social");
                    if (cat === "social_post") { lists.posts.appendChild(li); counts.posts++; }
                    else if (cat === "social_profile") { lists.profiles.appendChild(li); counts.profiles++; }
                    else { lists.links.appendChild(li); counts.links++; }
                });

                updateCounter("profilesCount", counts.profiles);
                updateCounter("postsCount", counts.posts);
                updateCounter("linksCount", counts.links);
            }

            // --- CLASSIFIERS ---
            function isSocialPost(url) {
                const lower = url.toLowerCase();
                return lower.includes("/p/") || lower.includes("/reel/") || lower.includes("/status/") || lower.includes("/video/") || lower.includes("/shorts/") || lower.includes("/post/");
            }

            function isSocialProfile(url) {
                const domains = ["instagram.com", "facebook.com", "x.com", "twitter.com", "tiktok.com", "threads.com", "youtube.com", "linkedin.com", "clubhouse.com"];
                return domains.some(domain => url.toLowerCase().includes(domain));
            }

            function escapeHtml(value) {
                const div = document.createElement("div");
                div.textContent = String(value);
                return div.innerHTML;
            }

            // --- BLOCKCHAIN INTEGRATION ---
            window.registerEvidence = async function() {
                if (!currentEvidence) return;
                setNotification("HASHING EVIDENCE // BROADCASTING TO SEPOLIA...");
                
                try {
                    const response = await fetch("/api/blockchain/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ evidence: currentEvidence })
                    });
                    const data = await response.json();
                    
                    if (!response.ok) throw new Error(data.detail || "Registration failed");

                    document.getElementById("blockchainOutput").textContent = 
                        `[REGISTERED SECURELY]\n\nHASH: ${data.evidence_hash}\nTX: ${data.transaction_hash}\nBLOCK: ${data.block_number}`;
                    setNotification("EVIDENCE COMMITTED TO BLOCKCHAIN.");
                } catch (error) {
                    setNotification("CHAIN ERROR.");
                    document.getElementById("blockchainOutput").textContent = `[CHAIN ERROR]\n${error.message}`;
                }
            };
            document.getElementById("registerButton").addEventListener("click", registerEvidence);

            window.verifyEvidence = async function() {
                if (!currentEvidence) return;
                setNotification("QUERYING SEPOLIA // VERIFYING HASH...");

                try {
                    const response = await fetch("/api/blockchain/verify", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ evidence: currentEvidence })
                    });
                    const data = await response.json();
                    
                    if (!response.ok) throw new Error(data.detail || "Verification failed");

                    if (data.valid) {
                        document.getElementById("blockchainOutput").textContent = 
                            `[VERIFIED]\nHASH MATCH CONFIRMED.\n\nHASH: ${data.evidence_hash}\nTIMESTAMP: ${data.blockchain_timestamp}`;
                        setNotification("INTEGRITY CHECK PASSED.");
                    } else {
                        document.getElementById("blockchainOutput").textContent = 
                            `[FAILED]\nHASH NOT FOUND. EVIDENCE MAY BE COMPROMISED.`;
                        setNotification("TAMPER DETECTED.");
                    }
                } catch (error) {
                    setNotification("VERIFICATION ERROR.");
                    document.getElementById("blockchainOutput").textContent = `[VERIFY ERROR]\n${error.message}`;
                }
            };
            document.getElementById("verifyButton").addEventListener("click", verifyEvidence);
        });
    </script>
</body>
</html>
